services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sales-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aisales
      POSTGRES_PASSWORD: aisales
      POSTGRES_DB: ai_sales_manager
    ports:
      - "5432:5432"
    volumes:
      - ai_sales_manager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisales -d ai_sales_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_sales_manager_pgdata:
